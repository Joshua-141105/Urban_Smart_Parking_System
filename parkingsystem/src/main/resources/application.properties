spring.application.name=parkingsystem

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/edith_parking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# Security / JWT
edith.app.jwtSecret=edithSecretKeyOnlyForDevelopmentNeedsToBeVeryLongToWorkWithHS512Algorithm
edith.app.jwtExpirationMs=86400000

# Server
server.port=8080

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Custom Properties
# OSRM Server URL (Public server for demo, can be local)
osrm.api.url=http://router.project-osrm.org
